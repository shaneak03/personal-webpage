name: Deploy personal-webpage

on:
  push:
    branches:
      - release
  workflow_dispatch:
    inputs:
      target:
        description: Deploy target
        required: true
        type: choice
        options:
          - release

concurrency:
  group: deploy-${{ github.ref_name || inputs.target }}
  cancel-in-progress: true

jobs:
  deploy-release:
    if: github.ref_name == 'release' || inputs.target == 'release'
    runs-on: ubuntu-latest

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy release over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script_stop: true
          script: |
            set -euo pipefail

            export DEPLOY_BRANCH=release
            export DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
            export DEPLOY_COMPOSE_FILE="${{ secrets.DEPLOY_COMPOSE_FILE }}"

            bash "$DEPLOY_PATH/deploy/deploy.sh"

